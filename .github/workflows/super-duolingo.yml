name: Super Automation

on:
  schedule:
    - cron: '0 0 * * *'  # Every day at 00:00 UTC
  workflow_dispatch:  # Allow manual run too

permissions:
  contents: read

jobs:
  request-super:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Send Super Request
        run: |
          echo "🚀 Requesting Super..."
          RESPONSE=$(curl --ssl-no-revoke -s -X POST https://duo-bot-api.onrender.com/api/session/complete \
            -H "x-api-key: ${{ secrets.DUOLINGO_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"type": "super"}')
          echo "📝 Response from server:"
          echo "$RESPONSE"
