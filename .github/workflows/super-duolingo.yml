name: Super Duolingo

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-duo:
    runs-on: ubuntu-latest
    steps:
      - name: Request Session via Private API
        env:
          API_KEY: ${{ secrets.MY_API_KEY }}
          DUO_TOKEN: ${{ secrets.DUOLINGO_TOKEN }}
        run: |
          curl -i -X POST "https://duo-bot-api.onrender.com/api/session/complete" \
            -H "X-API-Key: $API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"duolingoToken\": \"$DUO_TOKEN\",
              \"userId\": \"1672849858\",
              \"fromLanguage\": \"en\",
              \"learningLanguage\": \"zh\",
              \"challengeTime\": 60
            }"
