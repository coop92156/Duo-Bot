name: Super Duolingo

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-duo:
    runs-on: ubuntu-latest
    steps:
      - name: Request Session via Private API
        env:
          DUO_TOKEN: ${{ secrets.DUOLINGO_TOKEN }}
        run: |
          curl -s -X POST "https://duo-bot-api.onrender.com/api/session/complete" \
            -H "Authorization: Bearer $DUO_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "userId": "YOUR_DUOLINGO_USER_ID",
              "challengeTime": 60
            }'
